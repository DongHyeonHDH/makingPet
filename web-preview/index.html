<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Making Pet · 내 방</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf8f2;color:#292f24;font:16px/1.5 "Malgun Gothic",system-ui,sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #648849;outline-offset:3px}[hidden]{display:none!important}
.layout{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr)}.sidebar{position:sticky;top:0;align-self:start;min-height:100vh;padding:30px 18px;background:#f1efe5;border-right:1px solid #e6e2d4}.brand{font:900 25px system-ui;letter-spacing:-1px;margin:0 0 40px 10px}.brand span{color:#648849}nav{display:grid;gap:8px}nav button{text-align:left;background:transparent;border:0;padding:12px 16px;border-radius:14px;font-weight:700}nav button[aria-current=page]{background:#dbe8c8}main{width:min(100%,1200px);margin:auto;padding:44px clamp(18px,5vw,66px)}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:28px}h1,h2,p{margin:0}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.07em}h2{font-size:22px}.wallet{background:#fff1c9;padding:8px 14px;border-radius:30px;white-space:nowrap;font-weight:700}.room-grid{display:grid;grid-template-columns:minmax(0,1fr) 248px;gap:18px}.room{height:clamp(350px,54vw,520px);position:relative;overflow:hidden;isolation:isolate;border-radius:27px;background:linear-gradient(#e4edcf 71%,#ead9b8 71%);border:1px solid #dce2cc}.room[data-theme=lavender]{background:linear-gradient(#ebe1f6 71%,#ead9b8 71%)}.window{position:absolute;left:9%;top:11%;width:24%;max-width:135px;height:31%;border:9px solid #fff9e9;border-radius:60px 60px 12px 12px;background:linear-gradient(#b8ddec 65%,#9ab577 65%);box-shadow:0 5px 0 #bfcbaa}.window:after{content:'';position:absolute;inset:0 46%;background:#fff9e9}.rug{position:absolute;bottom:7%;left:18%;right:18%;height:20%;background:#c68e76;border:6px double #f7d3b6;border-radius:50%;opacity:.77}.plant{position:absolute;right:9%;bottom:23%;font-size:clamp(36px,7vw,76px)}.pet{position:absolute;bottom:13%;left:50%;translate:-50% 0;width:min(57%,300px);border:0;background:none;padding:0}.pet img{display:block;width:100%;aspect-ratio:1;object-fit:contain;border-radius:38%;mix-blend-mode:multiply}.pet.bounce{animation:bounce .45s ease}@keyframes bounce{50%{transform:translateY(-23px) rotate(-5deg)}}.bubble{position:absolute;top:10%;left:50%;translate:-50% 0;background:white;border-radius:24px;padding:7px 14px;white-space:nowrap;z-index:2}.panel,.card{background:#fffdf7;border:1px solid #e9e3d5;border-radius:24px;padding:22px}.panel p,.hint{color:#575e50;margin:7px 0 17px}.action{border:1px solid #e6e2d4;border-radius:12px;background:#f7f5ec;padding:10px 14px;font-weight:700}.panel .action{display:block;width:100%;margin-top:8px;text-align:left}.primary{background:#375536;color:white;border-color:#375536}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin:16px 0}.card img{display:block;width:100%;aspect-ratio:1;object-fit:contain;border-radius:15px}.card button{margin-top:10px}.status{min-height:1.5em;margin-top:14px}.row{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:900px){.layout{grid-template-columns:150px minmax(0,1fr)}.room-grid{grid-template-columns:1fr}.panel .action{display:inline-block;width:auto;margin-right:4px}}@media(max-width:600px){.layout{display:block}.sidebar{position:sticky;top:0;min-height:0;z-index:5;padding:max(7px,env(safe-area-inset-top)) 4px 7px;border-right:0;border-bottom:1px solid #e6e2d4}.brand{display:none}nav{display:flex;justify-content:space-between;gap:4px;overflow-x:auto}nav button{flex:0 0 auto;padding:9px 7px;text-align:center;font-size:13px;white-space:nowrap}main{padding:25px 14px 32px}.room{height:350px}}@media(prefers-reduced-motion:reduce){.pet.bounce{animation:none}}
</style>
<link rel="stylesheet" href="market.css"></head>
<body>
<div class="layout">
<aside class="sidebar"><p class="brand"><span>✿</span> Making Pet</p><nav aria-label="주 메뉴">
<button data-page="home" aria-current="page">⌂ 내 방</button><button data-page="draw">✦ 펫 뽑기</button><button data-page="collection">♡ 도감</button><button data-page="shop">상점</button><button data-page="auction">경매장</button><button data-page="board">▤ 게시판</button>
</nav></aside>
<main>
<header><h1 id="title">내 방</h1><span class="wallet">◉ <span id="coins">300</span> 코인</span></header>
<section id="home">
<div class="room-grid"><div class="room" id="room"><span class="window" aria-hidden="true"></span><span class="rug" aria-hidden="true"></span><span class="plant" aria-hidden="true">🪴</span><span class="bubble" id="bubble" hidden></span><button class="pet" id="pet" aria-label="펫 쓰다듬기"><img id="portrait" alt=""></button></div>
<aside class="panel"><h2 id="pet-name"></h2><p id="mood">편안해요</p><button class="action primary" id="pet-action">♡ 쓰다듬기</button><button class="action" id="play">✦ 놀아주기</button><button class="action" id="decorate" aria-expanded="false" aria-controls="themes">▧ 방 꾸미기</button><div id="themes" hidden><button class="action" data-theme="green">연두색 벽</button><button class="action" data-theme="lavender">라벤더색 벽</button></div></aside></div>
</section>
<section id="draw" hidden><div class="panel"><h2>새 친구 만나기</h2><p>뽑을 때마다 아직 만나지 않은 펫 한 마리가 도감에 추가돼요.</p><button class="action primary" id="draw-button">펫 뽑기 · 100 코인</button></div><div class="cards" id="draw-result"></div></section>
<section id="collection" hidden><div class="cards" id="pet-cards"></div></section>
<section id="shop" hidden><div class="cards" id="shop-items"></div></section>
<section id="auction" class="market" hidden>
<div class="market-tabs" role="tablist" aria-label="경매장 메뉴">
<button role="tab" data-market-tab="search" aria-selected="true">⌕ 검색</button>
<button role="tab" data-market-tab="prices" aria-selected="false">시세</button>
<button role="tab" data-market-tab="favorites" aria-selected="false">★ 찜목록</button>
<button role="tab" data-market-tab="sell" aria-selected="false">판매</button>
<button role="tab" data-market-tab="completed" aria-selected="false">완료</button>
</div>
<div class="market-grid" id="auction-grid">
<form class="filters" id="filters">
<label>아이템 분류<select id="item-type"><option value="">전체</option><option>액세서리</option><option>상의</option><option>신발</option><option>가구</option></select></label>
<label>아이템명<input id="item-query" type="search" placeholder="이름으로 검색"></label>
<label>최대 가격<input id="item-max" type="number" min="0" placeholder="코인"></label>
<div class="row"><button type="reset">초기화</button><button class="search" type="submit">검색 시작</button></div>
</form>
<div class="results">
<form id="sell-form" hidden>
<p id="sell-empty">상점이나 경매장에서 구매한 아이템을 판매할 수 있어요.</p>
<label>판매 아이템 <select id="sell-item" required></select></label>
<label>판매 가격 <input id="sell-price" type="number" min="1" max="999999999" required></label>
<button id="sell-submit">판매 등록</button>
</form>
<p id="market-count"></p>
<div class="table-scroll"><table aria-label="경매장 매물"><thead><tr><th scope="col">아이템 이름</th><th scope="col"><button id="sort-price">가격 ↕</button></th><th scope="col">개당 가격</th><th scope="col">남은 시간</th></tr></thead><tbody id="market-rows"></tbody></table></div>
<p id="market-empty" hidden>표시할 매물이 없어요.</p>
<div class="market-detail" id="market-detail" aria-live="polite"></div>
</div></div></section><section id="board" hidden><div class="panel"><h2>공지사항</h2><p>등록된 공지가 없어요.</p></div></section>
<p id="status" class="status" role="status"></p>
</main></div>
<script>
const pets = [
  {name:"오리", image:"duck-v2.png"},
  {name:"고양이", image:"cat.png"},
  {name:"강아지", image:"dog.png"},
  {name:"공룡", image:"dinosaur.png"}
];
const titles = {home:"내 방",draw:"펫 뽑기",collection:"도감",shop:"상점",auction:"경매장",board:"게시판"};
const initial = {coins:300,owned:[0],active:0,theme:"green"};
const byId = id => document.getElementById(id);
let state = initial;
try { state = JSON.parse(localStorage.getItem("makingpet-preview")) || initial; } catch {}
const asset = pet => "../pet-character-portraits/" + pet.image;
function save() {
  try { localStorage.setItem("makingpet-preview", JSON.stringify(state)); } catch {}
  render();
}
function render() {
  byId("coins").textContent = state.coins;
  const pet = pets[state.active];
  byId("portrait").src = asset(pet);
  byId("portrait").alt = pet.name;
  byId("pet-name").textContent = pet.name;
  byId("room").dataset.theme = state.theme;
  byId("draw-button").disabled = state.owned.length === pets.length || state.coins < 100;
  byId("draw-button").textContent = state.owned.length === pets.length ? "모든 펫을 만났어요" : "펫 뽑기 · 100 코인";
  byId("pet-cards").replaceChildren(...pets.map((entry,index) => card(entry,index)));
}
function card(pet,index) {
  const node = document.createElement("article");
  node.className = "card";
  const name = document.createElement("h2");
  const owned = state.owned.includes(index);
  name.textContent = owned ? pet.name : "아직 만나지 않은 펫";
  if (owned) {
    const img = document.createElement("img");
    img.src = asset(pet);
    img.alt = "";
    node.append(img);
  }
  node.append(name);
  if (owned) {
    const button = document.createElement("button");
    button.className = "action";
    button.textContent = state.active === index ? "내 방에 있어요" : "내 방으로 데려가기";
    button.disabled = state.active === index;
    button.onclick = () => { state.active = index; save(); show("home"); byId("mood").textContent = "편안해요"; };
    node.append(button);
  }
  return node;
}
function show(page) {
  for (const key of Object.keys(titles)) byId(key).hidden = key !== page;
  for (const button of document.querySelectorAll("[data-page]")) {
    if (button.dataset.page === page) button.setAttribute("aria-current","page");
    else button.removeAttribute("aria-current");
  }
  byId("title").textContent = titles[page];
  byId("status").textContent = "";
  if (page === "shop" || page === "auction") renderMarkets();
}
let bubbleTimer;
function react(message,mood) {
  const pet = byId("pet");
  pet.classList.remove("bounce");
  void pet.offsetWidth;
  pet.classList.add("bounce");
  byId("bubble").textContent = message;
  byId("bubble").hidden = false;
  byId("mood").textContent = mood;
  byId("status").textContent = pets[state.active].name + "가 " + mood;
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => { byId("bubble").hidden = true; },1800);
}
document.querySelectorAll("[data-page]").forEach(button => { button.onclick = () => show(button.dataset.page); });
byId("pet").onclick = byId("pet-action").onclick = () => react("기분 좋아! ♡","기분이 좋아요");
byId("play").onclick = () => react("한 번 더! ✦","신났어요");
byId("decorate").onclick = () => {
  const themes = byId("themes");
  themes.hidden = !themes.hidden;
  byId("decorate").setAttribute("aria-expanded",String(!themes.hidden));
};
document.querySelectorAll("button[data-theme]").forEach(button => { button.onclick = () => {
  state.theme = button.dataset.theme;
  save();
  byId("status").textContent = button.textContent + "으로 바꿨어요.";
}; });
byId("draw-button").onclick = () => {
  const available = pets.map((_, index) => index).filter(index => !state.owned.includes(index));
  if (!available.length || state.coins < 100) return;
  const index = available[Math.floor(Math.random() * available.length)];
  state = {...state, coins:state.coins-100, owned:[...state.owned,index]};
  save();
  byId("draw-result").replaceChildren(card(pets[index],index));
  byId("status").textContent = pets[index].name + "가 도감에 추가됐어요!";
};
render();
</script>
<script src="market.js"></script></body>
</html>
